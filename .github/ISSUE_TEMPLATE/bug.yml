name: Bug report
description: Something is broken or doesn't work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Skill version
      description: Include the Git commit and metadata.version in SKILL.md (top-level version for v1).
      placeholder: v2 preview, commit abc1234
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: AI harness
      options:
        - Claude Code
        - Codex CLI
        - Cursor
        - Gemini CLI
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: mission
    attributes:
      label: Relevant mission.md (sanitized)
      description: Paste the relevant sections; redact anything sensitive.
  - type: input
    id: model
    attributes:
      label: Model and agent version
      description: Include reasoning effort when known.
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Output and native-goal comparison
      description: Attach a small public fixture or sanitized result. If tested without Autopilot, describe the difference; otherwise say not tested.
