name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Verify skill discovery
        run: npx -y skills add . --list
      - name: Validate package and references
        run: python3 scripts/validate_package.py
      - name: State and preservation tests
        run: python3 -m unittest discover -s tests -v
      - name: Build documentation with the Pages toolchain
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site
      - name: Verify rendered search metadata, sitemap and links
        run: python3 scripts/validate_package.py --site-dir _site
