title: autopilot-skills
description: "Keep the mission, checked progress and next action for interrupted AI work in Codex and Claude Code."
plugins:
  - jekyll-sitemap
theme: minima
baseurl: "/autopilot-skills"
url: "https://presentjay.github.io"
markdown: kramdown
defaults:
  - scope:
      path: "ko"
    values:
      layout: page
      lang: ko
  - scope:
      path: "zh"
    values:
      layout: page
      lang: zh
  - scope:
      path: "ja"
    values:
      layout: page
      lang: ja
  - scope:
      path: ""
    values:
      layout: page
      lang: en
exclude:
  - PUBLISH.md
